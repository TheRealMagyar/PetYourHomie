name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: plugins.json
          body: |
            Pet Your Homie ${{ github.ref_name }}

            Scheduled kind, flirty, and Happy Femboy Friday message suggestions for Discord.

            Clone this repository directly as `src/userplugins/petYourHomie`, rebuild Equicord or Vencord, and restart Discord.
